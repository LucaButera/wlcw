defaults:
  - experiment
  - override model: patchtst
  - override gpi: none
  - override dataset: climate_ush
  - _self_

figure: "figure5-6"

trainer:
  limit_train_batches: 1200
  max_epochs: 50
engine:
  optim_kwargs:
    lr: 0.001
dataset:
  history: 0
  batch_size: 2560
  workers: 20
  add_temporal_encoding: false

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      seed: 1,2,3
      dataset.target_dims: T2M,ALLSKY_SFC_SW_DWN
      dataset.window: 720,336,168,72,24
